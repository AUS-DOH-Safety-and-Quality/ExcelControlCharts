name: Test Build Excel plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Run linter
      run: |
        bun run lint

    - name: Test if plugin can be built
      run: |
        bun run build
